version: 2

updates:
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      swift-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "*FluidAudio*"
    ignore:
      # D516: the speech engine moves only through an explicit review with
      # matched recognition, diarization and resource evidence. Excluding it
      # from the grouped refresh keeps an unrelated security update mergeable.
      - dependency-name: "*FluidAudio*"
    labels:
      - dependencies
      - swift

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - dependencies
      - github-actions
