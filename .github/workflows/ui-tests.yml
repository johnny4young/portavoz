name: Scoped UI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scoped-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.select.outputs.required }}
      tests: ${{ steps.select.outputs.tests }}
      locales: ${{ steps.select.outputs.locales }}
      summary: ${{ steps.select.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate the selector catalog
        run: |
          python3 scripts/ui_test_scope.py --validate-catalog
          python3 -m unittest Tests.Tooling.test_ui_test_scope
          python3 -m unittest Tests.Tooling.test_ui_test_runtime
          python3 -m unittest Tests.Tooling.test_run_ui_tests
          python3 -m unittest Tests.Tooling.test_ui_test_ci_gate
          python3 -m unittest Tests.Tooling.test_ui_test_host_preflight

      - name: Select UI evidence
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PREVIOUS_HEAD_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            python3 scripts/ui_test_scope.py --all --format github >> "$GITHUB_OUTPUT"
          else
            SELECTED_BASE_SHA="$BASE_SHA"
            if [[ "$EVENT_ACTION" == "synchronize" \
               && "$PREVIOUS_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              if git cat-file -e "${PREVIOUS_HEAD_SHA}^{commit}" 2>/dev/null; then
                SELECTED_BASE_SHA="$PREVIOUS_HEAD_SHA"
              else
                echo "::warning::Previous PR head is unavailable; expanding from the base SHA."
              fi
            fi
            python3 scripts/ui_test_scope.py \
              --base "$SELECTED_BASE_SHA" --head "$HEAD_SHA" \
              --format github >> "$GITHUB_OUTPUT"
          fi

      - name: Explain the selection
        env:
          SUMMARY: ${{ steps.select.outputs.summary }}
          TESTS: ${{ steps.select.outputs.tests }}
          LOCALES: ${{ steps.select.outputs.locales }}
        run: |
          echo "$SUMMARY"
          echo "Locales: ${LOCALES:-none}"
          echo "Selectors: ${TESTS:-none}"

  scoped-ui-tests:
    needs: scope
    if: needs.scope.outputs.required == 'true'
    runs-on: macos-latest
    # Localization/shared-harness and manual integration runs legitimately
    # select all 103 tests in both locales. One build feeds independent locale
    # attempts; both receipts are preserved before the deterministic gate.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select newest Xcode
        run: |
          NEWEST="$(find /Applications -maxdepth 1 -type d -name 'Xcode_*.app' -print | sort -V | tail -1)"
          echo "Selecting $NEWEST"
          sudo xcode-select -s "$NEWEST"

      - name: Install XcodeGen when absent
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Build selected UI products once
        env:
          UI_TESTS: ${{ needs.scope.outputs.tests }}
        run: make test-ui-build

      - name: Run English functional UI evidence
        id: ui_en
        if: contains(needs.scope.outputs.locales, 'en')
        continue-on-error: true
        env:
          UI_TESTS: ${{ needs.scope.outputs.tests }}
          UI_TEST_LOCALES: en
          # GitHub-hosted macOS wall-clock variance is reported in the receipt,
          # not promoted to performance authority. Local/stable-Mac integration
          # keeps the same unchanged budgets blocking by default.
          UI_TEST_ENFORCE_RUNTIME_BUDGET: "false"
        run: make test-ui-run

      - name: Run Spanish functional UI evidence
        id: ui_es
        if: contains(needs.scope.outputs.locales, 'es')
        continue-on-error: true
        env:
          UI_TESTS: ${{ needs.scope.outputs.tests }}
          UI_TEST_LOCALES: es
          UI_TEST_ENFORCE_RUNTIME_BUDGET: "false"
        run: make test-ui-run

      - name: Preserve scoped UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scoped-ui-${{ github.run_id }}
          path: dist/ui-test-results
          if-no-files-found: warn
          retention-days: 7

      - name: Classify functional evidence and hosted runtime drift
        if: always()
        env:
          UI_TEST_LOCALES: ${{ needs.scope.outputs.locales }}
          ENGLISH_OUTCOME: ${{ steps.ui_en.outcome }}
          SPANISH_OUTCOME: ${{ steps.ui_es.outcome }}
        run: |
          python3 scripts/ui_test_ci_gate.py \
            --results dist/ui-test-results \
            --locales "$UI_TEST_LOCALES" \
            --english-outcome "$ENGLISH_OUTCOME" \
            --spanish-outcome "$SPANISH_OUTCOME"

  ui-test-gate:
    needs: [scope, scoped-ui-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require selected evidence and allow an honest no-UI skip
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          UI_REQUIRED: ${{ needs.scope.outputs.required }}
          UI_RESULT: ${{ needs.scoped-ui-tests.result }}
        run: |
          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "UI scope selection failed: $SCOPE_RESULT" >&2
            exit 1
          fi
          if [[ "$UI_REQUIRED" == "true" && "$UI_RESULT" != "success" ]]; then
            echo "Selected UI tests did not pass: $UI_RESULT" >&2
            exit 1
          fi
          echo "Scoped UI gate passed (required=$UI_REQUIRED, result=$UI_RESULT)."
