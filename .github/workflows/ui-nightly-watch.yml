name: Nightly UI watch

# A schedule that never fires cannot report its own absence, so this also runs
# on every main push and has its own schedule.
on:
  push:
    branches: [main]
  schedule:
    - cron: "53 15 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: ui-nightly-watch
  cancel-in-progress: true

jobs:
  freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report stale nightly evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ui_nightly_health.py freshness --repository "$REPOSITORY"

  # The push run's own alert cannot report that it failed, or a run that started no job.
  ci-push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Match the issue to main's newest push run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ui_nightly_health.py push-watch --repository "$REPOSITORY"
