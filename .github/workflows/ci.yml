name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    # Own every deterministic repository/tooling contract exactly once and
    # fail before allocating either macOS runner.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repository, evidence, and CI policy contracts
        run: scripts/check-repository-hygiene.sh
      # The performance gate decides whether a release ships, so its rules run
      # on every PR. Measurements remain on the stable-Mac authority.
      - name: Release performance ledger rules
        run: python3 -m unittest Tests.Tooling.test_perf_ledger

  build-and-test:
    needs: repository-hygiene
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify fixed Tahoe toolchain
        run: scripts/verify-ci-toolchain.sh 26 26.6
      - name: Identify compatible Swift build state
        id: swift_cache_key
        run: python3 scripts/ci_swift_cache_key.py --lane build-and-test >> "$GITHUB_OUTPUT"
      # Main always compiles cold. PRs may reuse compilation, never test results.
      - name: Restore compatible Swift build state
        id: swift_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.swift_cache_key.outputs.key }}
          lookup-only: ${{ github.event_name != 'pull_request' }}
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
      - name: Verify cached source freshness
        if: github.event_name == 'pull_request' && steps.swift_cache.outputs.cache-hit == 'true'
        run: python3 scripts/ci_swift_source_stamps.py restore
      # One invocation owns compilation and tests with identical flags. The
      # former build-then-test pair changed compiler arguments and could pay a
      # second package build while producing two different diagnostic modes.
      - name: Current-SDK build and complete test suite
        run: scripts/run-swift-tests.sh -Xswiftc -warnings-as-errors
      # Bound storage and save only after the complete suite succeeds. Oversize
      # graphs stay cold; do not increase the repository's paid cache allowance.
      - name: Record successful source fingerprints
        if: steps.swift_cache.outputs.cache-hit != 'true'
        run: python3 scripts/ci_swift_source_stamps.py snapshot
      - name: Check Swift cache size
        id: swift_cache_size
        if: steps.swift_cache.outputs.cache-hit != 'true'
        run: |
          size_kib="$(du -sk .build | awk '{print $1}')"
          echo "Swift build cache: $size_kib KiB (limit 6291456 KiB)"
          if (( size_kib <= 6291456 )); then
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save successful Swift build state
        if: steps.swift_cache_size.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.swift_cache_key.outputs.key }}

  sequoia-compatibility:
    needs: repository-hygiene
    # The product floor is Sonoma 14.4, but Sequoia is the oldest supported
    # release lane. Run the complete package suite on that OS instead of only
    # compiling against an old deployment target from the latest runner.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify fixed Sequoia toolchain
        run: scripts/verify-ci-toolchain.sh 15 26.3
      - name: Identify compatible Swift build state
        id: swift_cache_key
        run: python3 scripts/ci_swift_cache_key.py --lane sequoia-compatibility >> "$GITHUB_OUTPUT"
      # Main always compiles cold. PRs may reuse compilation, never test results.
      - name: Restore compatible Swift build state
        id: swift_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.swift_cache_key.outputs.key }}
          lookup-only: ${{ github.event_name != 'pull_request' }}
        env:
          SEGMENT_DOWNLOAD_TIMEOUT_MINS: "2"
      - name: Verify cached source freshness
        if: github.event_name == 'pull_request' && steps.swift_cache.outputs.cache-hit == 'true'
        run: python3 scripts/ci_swift_source_stamps.py restore
      - name: Build and test on Sequoia
        run: scripts/run-swift-tests.sh
      # Bound storage and save only after the complete suite succeeds. Oversize
      # graphs stay cold; do not increase the repository's paid cache allowance.
      - name: Record successful source fingerprints
        if: steps.swift_cache.outputs.cache-hit != 'true'
        run: python3 scripts/ci_swift_source_stamps.py snapshot
      - name: Check Swift cache size
        id: swift_cache_size
        if: steps.swift_cache.outputs.cache-hit != 'true'
        run: |
          size_kib="$(du -sk .build | awk '{print $1}')"
          echo "Swift build cache: $size_kib KiB (limit 6291456 KiB)"
          if (( size_kib <= 6291456 )); then
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Save successful Swift build state
        if: steps.swift_cache_size.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.swift_cache_key.outputs.key }}

  ios-portability:
    needs: repository-hygiene
    # Compile the exact future shared surface in its own current-SDK lane. A
    # failure means an iOS deployment/API break, not a duplicate macOS test or
    # an unavailable signed-container/device assertion.
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify fixed Tahoe toolchain
        run: scripts/verify-ci-toolchain.sh 26 26.6
      - name: Compile transport-neutral iOS 17 surface
        run: scripts/check-ios-portability.sh

  lint:
    needs: repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Strict SwiftLint 0.65.0 from checksum-pinned official archive
        run: scripts/run-ci-swiftlint.sh
