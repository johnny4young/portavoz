name: Nightly UI

# Pull requests run feature-scoped UI evidence plus smoke canaries; this run
# owns the complete English catalog on main, split into balanced shards.
on:
  schedule:
    # Off-peak: the macOS slots are shared with daytime pull requests.
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ui-products:
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      tests: ${{ steps.select.outputs.tests }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify fixed Tahoe toolchain
        run: scripts/verify-ci-toolchain.sh 26 26.6

      - name: Install checksum-pinned XcodeGen 2.46.0
        run: scripts/install-ci-xcodegen.sh "$RUNNER_TEMP/portavoz-xcodegen"

      - name: Select the complete catalog
        id: select
        run: python3 scripts/ui_test_scope.py --validate-catalog --all --format github >> "$GITHUB_OUTPUT"

      - name: Build every UI product once
        env:
          UI_TESTS: ${{ steps.select.outputs.tests }}
          UI_TEST_PRODUCTS_PATH: ${{ runner.temp }}/ui-products/portavoz-ui.xctestproducts
          UI_TEST_BUILD_RECEIPT: ${{ runner.temp }}/ui-products/build-duration-seconds.txt
        run: make test-ui-build

      # Artifacts drop the executable bit and symlinks; tar keeps the .app intact.
      - name: Archive the exact products with their bundle permissions
        run: |
          tar -cf "$RUNNER_TEMP/ui-products.tar" -C "$RUNNER_TEMP/ui-products" .
          zstd -T0 -3 --rm "$RUNNER_TEMP/ui-products.tar"

      - name: Publish the exact UI products for the shards
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-ui-products-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-products.tar.zst
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  interruption-controls:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify fixed Tahoe toolchain
        run: scripts/verify-ci-toolchain.sh 26 26.6

      - name: Install checksum-pinned XcodeGen 2.46.0
        run: scripts/install-ci-xcodegen.sh "$RUNNER_TEMP/portavoz-xcodegen"

      - name: Verify interruption safety at the shared callback
        run: make test-ui-interruption-safety UI_INTERRUPTION_RESULTS="$RUNNER_TEMP/ui-interruption-safety"

  # Main's seeds are incremental, so this is the authority for a clean build, and later
  # runs continue from its seed.
  clean-build-and-test:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify fixed Tahoe toolchain
        run: scripts/verify-ci-toolchain.sh 26 26.6

      - name: Identify compatible Swift build state
        id: swift_cache_key
        run: python3 scripts/ci_swift_cache_key.py --lane build-and-test --commit "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Clean build and complete test suite
        env:
          PORTAVOZ_XCTEST_BATCH_SEED: ${{ github.run_id }}
          PORTAVOZ_SWIFT_INCLUDE_NIGHTLY_ONLY: "1"
        run: scripts/run-swift-tests.sh --disable-default-traits --only-use-versions-from-resolved-file -Xswiftc -warnings-as-errors

      - name: Record successful source fingerprints
        if: github.ref == 'refs/heads/main'
        run: python3 scripts/ci_swift_source_stamps.py snapshot

      - name: Check Swift cache size
        id: swift_cache_size
        if: github.ref == 'refs/heads/main'
        run: scripts/check-swift-cache-size.sh

      - name: Save the clean Swift build state
        if: steps.swift_cache_size.outputs.save == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build
          key: ${{ steps.swift_cache_key.outputs.clean_key }}

  # After the jobs above, so the account's five macOS slots never hold more than three of ours.
  shard:
    needs: [build-ui-products, interruption-controls, clean-build-and-test]
    if: ${{ !cancelled() && needs.build-ui-products.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify fixed Tahoe toolchain
        run: scripts/verify-ci-toolchain.sh 26 26.6

      - name: Restore the exact UI products
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-ui-products-${{ github.run_id }}
          path: ${{ runner.temp }}/ui-archive

      - name: Unpack the products with their bundle permissions
        run: |
          mkdir -p "$RUNNER_TEMP/ui-products"
          zstd -d --rm "$RUNNER_TEMP/ui-archive/ui-products.tar.zst"
          tar -xf "$RUNNER_TEMP/ui-archive/ui-products.tar" -C "$RUNNER_TEMP/ui-products"

      - name: Select shard ${{ matrix.shard }} of 3
        id: select
        run: python3 scripts/ui_test_scope.py --all --shard "${{ matrix.shard }}/3" --format github >> "$GITHUB_OUTPUT"

      - name: Run shard ${{ matrix.shard }} in English
        id: ui
        continue-on-error: true
        env:
          UI_TESTS: ${{ steps.select.outputs.tests }}
          UI_TEST_LOCALES: en
          UI_TEST_PRODUCTS_PATH: ${{ runner.temp }}/ui-products/portavoz-ui.xctestproducts
          UI_TEST_BUILD_RECEIPT: ${{ runner.temp }}/ui-products/build-duration-seconds.txt
          # Hosted wall-clock variance stays advisory, as on pull requests.
          UI_TEST_ENFORCE_RUNTIME_BUDGET: "false"
        run: make test-ui-run

      # The pull-request classifier separates product failures from a known
      # hosted-automation outage, so infrastructure noise is not a red product.
      - name: Classify shard ${{ matrix.shard }} evidence
        id: classify
        if: always()
        env:
          OUTCOME: ${{ steps.ui.outcome }}
        run: |
          python3 scripts/ui_test_ci_gate.py --results dist/ui-test-results --locales en \
            --english-outcome "$OUTCOME" --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT"

      # A green nightly must mean verified evidence, so an advisory shard fails too.
      - name: Require verified shard ${{ matrix.shard }} evidence
        if: always()
        env:
          STATE: ${{ steps.classify.outputs.state }}
          VERIFIED: ${{ steps.classify.outputs.verified }}
        run: |
          if [[ "$STATE" != "passed" || "$VERIFIED" != "true" ]]; then
            echo "Shard ${{ matrix.shard }} is not verified ($STATE/$VERIFIED); dispatch the nightly again." >&2
            exit 1
          fi

      - name: Record shard ${{ matrix.shard }} selection and outcome
        if: always()
        env:
          SELECTED: ${{ steps.select.outputs.tests }}
          OUTCOME: ${{ steps.ui.outcome }}
        run: |
          mkdir -p dist/ui-test-results
          printf '%s\n' "$SELECTED" > dist/ui-test-results/en-selected-tests.txt
          printf '%s\n' "$OUTCOME" > dist/ui-test-results/en-outcome.txt

      # Successful nights must retain exact selected/executed identities too.
      # Keep attempts distinct; a rerun must not overwrite an earlier shard.
      - name: Preserve compact shard ${{ matrix.shard }} UI receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-ui-receipts-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/ui-test-results/en-selected-tests.txt
            dist/ui-test-results/en-outcome.txt
            dist/ui-test-results/en-runtime.json
            dist/ui-test-results/en-execution.json
          if-no-files-found: error
          retention-days: 7

      - name: Preserve shard ${{ matrix.shard }} UI evidence
        if: always() && (steps.ui.outcome != 'success' || steps.classify.outputs.verified != 'true')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-ui-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: dist/ui-test-results
          if-no-files-found: warn
          retention-days: 7

  alert:
    needs: [build-ui-products, interruption-controls, clean-build-and-test, shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report an unverified night
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/ui_nightly_health.py alert --needs "$NEEDS" --ref "$REF" --sha "$SHA" --run-url "$RUN_URL"
