# XcodeGen spec — the source of truth for Portavoz.xcodeproj.
# Regenerate with `xcodegen generate` (or `make project`). Do not hand-edit
# the generated .xcodeproj; it is git-ignored.
#
# Why an Xcode project when D20 says "SPM + make-app.sh, no Xcode project":
# XCUITest needs one. This project exists ONLY for automated UI verification
# (`make test-ui`) so we don't drive the screen by hand. The release/notarized
# build still comes from scripts/make-app.sh — this is not the shipping path.
name: Portavoz

options:
  bundleIdPrefix: app.portavoz
  deploymentTarget:
    macOS: "14.4"
  createIntermediateGroups: true
  groupSortPosition: top
  developmentLanguage: en
  knownRegions:
    - en
    - es
    - Base

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Ad-hoc by default; run-ui-tests.sh accepts an explicit local certificate
    # for native-client trust stability. This is not distribution signing.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO

packages:
  # The whole Portavoz SPM package (all Kits + Sparkle transitively).
  Portavoz:
    path: "."
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.0.0

targets:
  Portavoz:
    type: application
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - path: Sources/portavoz-app
      - path: Resources/Localization/Portavoz/Localizable.xcstrings
      - path: Resources/Localization/Portavoz/InfoPlist.xcstrings
    settings:
      base:
        # Never register disposable DerivedData builds as the shipping app.
        # Duplicate identities poison LaunchServices/App Intents discovery.
        PRODUCT_BUNDLE_IDENTIFIER: app.portavoz.mac.uitest-host
        CODE_SIGN_ENTITLEMENTS: packaging/portavoz-local.entitlements
    # XCUITest must exercise the same external recording handoff as the
    # shipping script-built bundle. XcodeGen writes this ignored plist from
    # tracked properties; the release Info.plist remains owned by make-app.sh.
    info:
      path: dist/PortavozUITest-Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations:
          - en
          - es
        CFBundleURLTypes:
          - CFBundleURLName: app.portavoz.mac.uitest-host
            CFBundleURLSchemes:
              - portavoz
        LSApplicationCategoryType: public.app-category.productivity
        NSMicrophoneUsageDescription: "Portavoz records your microphone to transcribe your side of the meeting. Audio never leaves your Mac."
        NSAudioCaptureUsageDescription: "Portavoz captures system audio to transcribe other meeting participants. Audio never leaves your Mac."
        NSRemindersFullAccessUsageDescription: "Portavoz creates a reminder only after you preview and confirm it. It is saved to the Reminders list you choose, which may sync through that account."
    dependencies:
      - package: Portavoz
        products:
          - ApplicationKit
          - PlatformKit
          - AudioCaptureKit
          - PortavozCore
          - ModelStoreKit
          - TranscriptionKit
          - DiarizationKit
          - IntelligenceKit
          - StorageKit
          - IntegrationsKit
          - AudioPlaybackKit
      - package: Sparkle

  PortavozDictationReceiver:
    type: application
    platform: macOS
    deploymentTarget: "14.4"
    sources:
      - path: Tests/PortavozDictationReceiver
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.portavoz.dictation-test-receiver
        GENERATE_INFOPLIST_FILE: YES

  # UI smoke harness. XCTest lives here; the package unit tests stay XCTest
  # too (D13) but run via `swift test` — this target is macOS UI automation.
  PortavozUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.4"
    settings:
      base:
        # A UI-test bundle isn't MainActor-isolated like the app.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        # Synthetic app/runner handoffs use only this test-owned shared root.
        # Preserve the runner sandbox; no production entitlement is changed.
        CODE_SIGN_ENTITLEMENTS: packaging/portavoz-uitests.entitlements
        # macOS Gatekeeper blocks an unsigned XCUITest runner; let Xcode sign it.
        GENERATE_INFOPLIST_FILE: YES
    sources:
      - path: Tests/PortavozUITests
      - path: Tests/Support
    dependencies:
      - target: Portavoz
      - target: PortavozDictationReceiver

schemes:
  Portavoz:
    build:
      targets:
        Portavoz: all
        PortavozUITests: [test]
        PortavozDictationReceiver: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PortavozUITests
