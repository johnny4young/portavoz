<!-- @dsCard group="Brand" viewport="700x180" name="Icon — three voices" subtitle="Three voice strands, the amber one swelling · light and dark · monochrome menu bar template" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bg-window); font-family: var(--font-app); color: var(--text-primary); display: flex; align-items: center; gap: 24px; }
  a { color: var(--accent); } a:hover { opacity: 0.8; }
</style>
</head>
<body>
<img src="../assets/portavoz-icon.svg" width="132" height="132" alt="Portavoz app icon">
<img src="../assets/portavoz-icon-light.svg" width="132" height="132" alt="Portavoz app icon, light">
<div style="display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 18px; border-radius: 12px; background: var(--brand-radial);">
  <span style="color: #f3f1ec; display: inline-flex;"><img src="../assets/portavoz-mark-menubar.svg" width="20" height="18" alt="" style="filter: invert(1);"></span>
  <span style="font: 500 9px/1.3 var(--font-mono); color: var(--brand-ink-dim);">menu bar 16px<br>monocromo</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; max-width: 30ch;">
  <span style="font: 600 13px/1.4 var(--font-app);">Three voices</span>
  <span style="font: var(--type-callout); color: var(--text-secondary);">Three strands, one per voice; the amber one is you and swells widest. In the menu bar it is a monochrome template at rest; the middle swell turns red while recording.</span>
  <span style="font: var(--type-caption); color: var(--text-tertiary);">assets/portavoz-icon.svg · portavoz-icon-light.svg · portavoz-mark-menubar.svg</span>
</div>
</body>
</html>
